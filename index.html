  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; background: var(--canvas) var(--pattern); color: var(--on-canvas);
    font-family: "Almarai", "Segoe UI", Tahoma, sans-serif; line-height: 1.6; overflow-x: hidden;
  }
  .defs { position: absolute; width: 0; height: 0; overflow: hidden; }

  /* ---------- live background: soft glows that float on their own ---------- */
  .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; contain: strict; }
  .glow { position: absolute; border-radius: 50%; }
  .g1 { width: 260px; height: 260px; top: 46%; right: -90px; background: radial-gradient(circle, var(--glow-a), transparent 68%); animation: float1 13s ease-in-out infinite; }
  .g2 { width: 240px; height: 240px; top: 64%; left: -100px; background: radial-gradient(circle, var(--glow-b), transparent 68%); animation: float2 17s ease-in-out infinite; }
  .g3 { width: 200px; height: 200px; bottom: 4%; right: 8%; background: radial-gradient(circle, var(--glow-a), transparent 68%); animation: float3 11s ease-in-out infinite; }
  .g4 { width: 220px; height: 220px; top: 8%; left: -80px; background: radial-gradient(circle, var(--glow-a), transparent 70%); animation: float4 15s ease-in-out infinite; }
  .g5 { width: 180px; height: 180px; top: 26%; right: 6%; background: radial-gradient(circle, var(--glow-b), transparent 70%); animation: float2 19s ease-in-out infinite reverse; }
  @keyframes float1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-150px,-120px) scale(1.25); } }
  @keyframes float2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(170px,-110px) scale(.85); } }
  @keyframes float3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-130px,-170px) scale(1.3); } }
  @keyframes float4 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(140px,160px) scale(1.2); } }

  /* ---------- stage: photo on top, content rises over its lower part ---------- */
  .stage { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; will-change: transform; }
  .hero { position: relative; width: 100%; aspect-ratio: 9 / 16; background: #3a342d var(--lqip, none) center / cover no-repeat;
    -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 34%, rgba(0,0,0,.8) 42%, rgba(0,0,0,.5) 50%, rgba(0,0,0,.25) 58%, rgba(0,0,0,.09) 65%, rgba(0,0,0,.02) 71%, transparent 76%);
            mask-image: linear-gradient(to bottom, #000 0, #000 34%, rgba(0,0,0,.8) 42%, rgba(0,0,0,.5) 50%, rgba(0,0,0,.25) 58%, rgba(0,0,0,.09) 65%, rgba(0,0,0,.02) 71%, transparent 76%); }
  .hero img { display: block; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .6s ease-out; }
  .hero img.in { opacity: 1; }
  @media (min-width: 560px) {
    .stage { padding-top: 28px; }
    .hero { border-radius: 32px 32px 0 0; overflow: hidden; }
  }

  /* gold stars over the photo: slow turn + twinkle */
  .sparks { position: absolute; inset: 0 0 auto 0; aspect-ratio: 9 / 16; z-index: 2; pointer-events: none; }
  @media (min-width: 560px) { .sparks { top: 28px; } }
  .sp { position: absolute; color: var(--accent); }
  .sp svg { display: block; width: 100%; height: 100%; }
  .s { animation: bob ease-in-out infinite, twinkle ease-in-out infinite; opacity: .55; }
  .s1 { width: 52px; height: 52px; top: 5%; right: 7%; animation-duration: 7s, 5s; }
  .s2 { width: 34px; height: 34px; top: 13%; left: 9%; animation-duration: 6s, 4.2s; animation-delay: -2s, 1.2s; }
  .s3 { width: 28px; height: 28px; top: 36%; right: 6%; animation-duration: 5.5s, 3.6s; animation-delay: -1s, .6s; }
  .s4 { width: 40px; height: 40px; top: 41%; left: 5%; animation-duration: 8s, 4.8s; animation-delay: -3s, 2s; }
  .p { animation: pop ease-in-out infinite; opacity: 0; }
  .p1 { width: 20px; height: 20px; top: 28%; left: 15%; animation-duration: 3.4s; animation-delay: .4s; }
  .p2 { width: 16px; height: 16px; top: 23%; right: 17%; animation-duration: 3s; animation-delay: 1.4s; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-12px) rotate(6deg); } }
  @keyframes twinkle { 0%,100% { opacity: .38; } 50% { opacity: .95; } }
  @keyframes pop { 0%,100% { opacity: 0; transform: scale(.5); } 45%,55% { opacity: .95; transform: scale(1.05); } }

  .content { position: relative; z-index: 3; margin-top: -86%; padding: 0 18px; }

  /* ---------- header ---------- */
  header { position: relative; text-align: center; padding: 14px 0 4px; }
  header::before { content: ""; position: absolute; z-index: -1; inset: -34px -6px -26px;
    background: radial-gradient(closest-side, rgba(var(--canvas-rgb),.92), rgba(var(--canvas-rgb),.6) 60%, rgba(var(--canvas-rgb),0)); }
  .badge { display: inline-flex; align-items: center; gap: 7px; padding: 6px 16px; border-radius: 999px;
    background: linear-gradient(135deg, var(--gold-hi), var(--accent) 52%, var(--gold-lo)); color: var(--on-accent);
    font-weight: 800; font-size: .95rem; box-shadow: 0 6px 18px rgba(var(--gold-rgb),.35);
    transition: transform .3s ease-out; animation: rise .45s ease-out backwards; cursor: default; }
  .badge:hover, .badge:active { transform: translateY(-2px) scale(1.04); }
  h1 { margin: 10px 0 0; font-size: clamp(2.1rem, 9.6vw, 2.7rem); line-height: 1.25; font-weight: 800; animation: rise .45s .05s ease-out backwards; }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: 1.02rem; animation: rise .45s .1s ease-out backwards; }

  /* ---------- contact ---------- */
  .contact { display: flex; gap: 10px; margin-top: 18px; animation: rise .45s .15s ease-out backwards; }
  .btn { position: relative; overflow: hidden; min-height: 54px; display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    border-radius: 16px; font: inherit; font-weight: 800; font-size: 1.06rem; text-decoration: none; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .2s ease-out, box-shadow .2s ease-out, background-color .2s ease-out, color .2s ease-out, filter .2s ease-out; }
  .btn svg { width: 22px; height: 22px; flex: none; transition: transform .3s ease-out; }
  .btn:active { transform: scale(.96); }
  .btn:focus-visible, .row:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .btn-wa { flex: 1; color: var(--on-accent); box-shadow: 0 8px 22px rgba(var(--gold-rgb),.38);
    background: linear-gradient(135deg, var(--gold-hi), var(--accent) 50%, var(--gold-lo)); }
  .btn-wa::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: 0;
    background: linear-gradient(100deg, transparent, rgba(239,227,206,.75), transparent); transform: translateX(-160%) skewX(-18deg);
    animation: shine 1s ease-out 1.1s 1; }
  @keyframes shine { from { transform: translateX(-160%) skewX(-18deg); } to { transform: translateX(330%) skewX(-18deg); } }
  .btn-call { flex: 0 0 auto; padding: 0 22px; background: transparent; color: var(--on-canvas); border: 2px solid var(--main); }
  @media (prefers-color-scheme: dark) { .btn-call { border-color: rgba(var(--gold-rgb),.55); } }
  .btn-call:active { background: var(--main); color: var(--on-main); }
  @media (hover: hover) {
    .btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-hi); }
    .btn-wa:hover { filter: brightness(1.06); box-shadow: 0 14px 30px rgba(var(--gold-rgb),.5); }
    .btn-wa:hover::after { animation: shine .7s ease-out; }
    .btn-wa:hover svg { transform: rotate(-12deg) scale(1.1); }
    .btn-call:hover { background: var(--main); color: var(--on-main); }
    .btn-call:hover svg { animation: ring .5s ease-in-out; }
  }
  @keyframes ring { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-14deg); } 75% { transform: rotate(14deg); } }

  /* ---------- follow ---------- */
  .divider { display: flex; align-items: center; gap: 12px; margin: 22px 0 14px; color: var(--muted); font-weight: 700; font-size: .95rem;
    animation: rise .45s .25s ease-out backwards; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(var(--gold-rgb),.75), transparent); }
  .divider svg { width: 20px; height: 20px; color: var(--accent); }
  .links { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .row { position: relative; display: flex; align-items: center; gap: 14px; min-height: 70px; padding: 12px 14px 12px 16px;
    border-radius: var(--radius); background: var(--main); color: var(--on-main); border: 1px solid var(--row-line);
    box-shadow: var(--shadow); text-decoration: none; -webkit-tap-highlight-color: transparent; overflow: hidden;
    transition: transform .25s ease-out, box-shadow .25s ease-out, border-color .25s ease-out; animation: rise .45s ease-out backwards; }
  .row::before { content: ""; position: absolute; inset: 0; background: radial-gradient(120px 70px at 85% 50%, rgba(var(--gold-rgb),.22), transparent 70%);
    opacity: 0; transition: opacity .3s ease-out; }
  .ico { position: relative; flex: none; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center;
    background: rgba(232,216,188,.08); border: 1px solid rgba(var(--gold-rgb),.38); }
  .ico svg { width: 22px; height: 22px; transition: transform .35s cubic-bezier(.3,1.6,.5,1); }
  .txt { position: relative; flex: 1; display: flex; flex-direction: column; line-height: 1.35; min-width: 0; }
  .txt b { font-size: 1.1rem; font-weight: 800; }
  .txt small { color: var(--accent); font-size: .9rem; font-weight: 700; text-align: right; }
  .go { position: relative; flex: none; width: 22px; height: 22px; color: var(--accent); transition: transform .3s ease-out; }
  .row:active { transform: scale(.97); }
  .row:active::before { opacity: 1; }
  @media (hover: hover) {
    .row:hover { transform: translateY(-3px); box-shadow: var(--shadow-hi), 0 0 0 1px rgba(var(--gold-rgb),.35); border-color: rgba(var(--gold-rgb),.7); }
    .row:hover::before { opacity: 1; }
    .row:hover .ico svg { transform: rotate(-10deg) scale(1.15); }
    .row:hover .go { transform: translateX(-5px); }
  }

  /* ---------- footer with live waves ---------- */
  footer { position: relative; z-index: 1; margin-top: 44px; text-align: center; }
  .waves { position: relative; height: 64px; overflow: hidden; }
  .wave { position: absolute; bottom: 0; left: 0; width: 200%; height: 100%; will-change: transform; }
  .wave path { fill: var(--main); }
  .w1 { opacity: .35; animation: slideSwell 9s linear infinite; }
  .w2 { opacity: .6; animation: slideSwell 6.5s linear infinite reverse; }
  .w3 { animation: slide 12s linear infinite; }
  @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @keyframes slideSwell { 0% { transform: translate(0,0); } 25% { transform: translate(-12.5%,8px); } 50% { transform: translate(-25%,0); } 75% { transform: translate(-37.5%,8px); } 100% { transform: translate(-50%,0); } }
  .foot { background: var(--main); padding: 4px 16px calc(26px + env(safe-area-inset-bottom)); }
  .foot p { margin: 0; color: var(--accent); font-weight: 800; font-size: 1rem; }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .paused * { animation-play-state: paused !important; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .hero img { opacity: 1; }
  }
</style>
<noscript><style>.hero img { opacity: 1; }</style></noscript>
